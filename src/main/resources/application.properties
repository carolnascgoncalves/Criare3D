spring.application.name=criare3d

# Servidor
server.port=${PORT:8080}

# Conexao com PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/criare3d}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# O V1 cria bancos novos; bancos existentes são registrados no V1 e recebem V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Thymeleaf
spring.thymeleaf.cache=true

# Upload opcional da foto da peça no histórico
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=8MB
