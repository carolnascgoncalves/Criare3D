spring.application.name=criare3d

# Servidor
server.port=${PORT:8080}

# Conexao com PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/criare3d}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# O V1 cria bancos novos; bancos existentes são registrados no V1 e recebem V2.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# Thymeleaf
spring.thymeleaf.cache=true

# Limites para projetos 3MF; fotos do histórico continuam validadas em até 3 MB no controller.
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=52MB
server.tomcat.max-http-form-post-size=52MB

# Render termina TLS no proxy; respeita os cabeçalhos encaminhados e protege o cookie de sessão.
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m

# Compressão HTTP e cache com URL versionada pelo conteúdo dos arquivos estáticos.
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/javascript,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/**
spring.web.resources.cache.cachecontrol.max-age=365d

# Consultas e templates devem carregar explicitamente os dados necessários.
spring.jpa.open-in-view=false

# Preencha com AAAA-MM-DD depois de conferir Shopee, TikTok Shop e Mercado Livre.
criare.tarifas.conferidas-em=

# Token de acesso da aplicação Mercado Livre; manter apenas como variável de ambiente no servidor.
criare.integracoes.mercado-livre.access-token=${CRIARE_ML_ACCESS_TOKEN:}

# Apenas a saúde geral é pública; nenhum detalhe de banco ou credencial é exposto.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
