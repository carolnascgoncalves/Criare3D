<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f3f4f6">
    <meta name="turbo-cache-control" content="no-cache">
    <title>Acessar conta</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-esm.min.js"></script>
</head>

<body class="login-pagina">
<main class="login-cartao">
    <header class="login-cabecalho">
        <span class="login-etiqueta">ÁREA DE ACESSO</span>
        <h1>Acessar sua conta</h1>
        <p>Entre com os dados de acesso da sua conta para continuar.</p>
    </header>

    <div th:if="${param.erro}" class="login-aviso login-aviso-erro" role="alert">
        E-mail ou senha incorretos. Confira os dados e tente novamente.
    </div>

    <div th:if="${param.logout}" class="login-aviso login-aviso-sucesso" role="status">
        Você saiu da sua conta com sucesso.
    </div>

    <form th:action="@{/login}" method="post" class="login-formulario" novalidate>
        <div class="login-campo">
            <label for="email">E-mail</label>
            <input type="email"
                   id="email"
                   name="email"
                   placeholder="voce@exemplo.com"
                   autocomplete="username"
                   required
                   autofocus>
        </div>

        <div class="login-campo">
            <label for="password">Senha</label>
            <input type="password"
                   id="password"
                   name="password"
                   placeholder="Digite sua senha"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="login-botao">Entrar</button>
    </form>

    <footer class="login-rodape">Acesso seguro à plataforma</footer>
</main>
</body>
</html>
