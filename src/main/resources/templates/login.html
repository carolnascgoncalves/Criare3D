
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Criare 3D | Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <meta name="turbo-cache-control" content="no-cache">
    <script type="module" src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-esm.min.js"></script>

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5e7da;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 38px;
            border-radius: 18px;
            border: 1px solid #ead6c8;
            box-shadow: 0 8px 30px rgba(73, 46, 30, 0.08);
        }

        .login-logo {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 16px;
            margin-bottom: 18px;
        }

        .login-titulo {
            color: #492e1e;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .login-descricao {
            color: #765b4b;
            margin-bottom: 28px;
        }

        .form-label {
            color: #492e1e;
            font-weight: 600;
        }

        .form-control {
            border-color: #ead6c8;
            padding: 11px 13px;
        }

        .form-control:focus {
            border-color: #e9a695;
            box-shadow: 0 0 0 0.2rem rgba(233, 166, 149, 0.2);
        }

        .botao-login {
            width: 100%;
            border: none;
            border-radius: 9px;
            padding: 12px;
            background: #492e1e;
            color: white;
            font-weight: 600;
            margin-top: 12px;
        }

        .botao-login:hover {
            background: #765b4b;
        }
    </style>
</head>

<body>

<main class="login-card">

    <div class="text-center">
        <img th:src="@{/images/criare3d.jpg}"
             alt="Criare 3D"
             class="login-logo">

        <h1 class="login-titulo">Bem-vindo ao Criare 3D!</h1>
        <p class="login-descricao">Entre com seu e-mail e senha para continuar.</p>
    </div>

    <div th:if="${param.erro}" class="alert alert-danger notificacao-flutuante">
        E-mail ou senha incorretos.
    </div>

    <div th:if="${param.logout}" class="alert alert-success notificacao-flutuante">
        Você saiu da sua conta com sucesso.
    </div>

    <form th:action="@{/login}" method="post" novalidate>

        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email"
                   id="email"
                   name="email"
                   class="form-control"
                   placeholder="seu@email.com"
                   autocomplete="username"
                   required
                   autofocus>
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Senha</label>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Digite sua senha"
                   autocomplete="current-password"
                   required>
        </div>

        <button type="submit" class="botao-login">
            Entrar
        </button>

    </form>

</main>

</body>
</html>
