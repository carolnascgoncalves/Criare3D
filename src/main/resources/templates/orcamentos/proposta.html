<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecalho('Proposta comercial')}"></head><body><nav th:replace="~{fragmentos :: menu}"></nav><main class="pagina pagina-pedidos pedido-proposta"><div class="pedido-acoes pedido-nao-imprimir"><a class="botao botao-secundario" th:href="@{/orcamentos/{id}(id=${pedido.id},etapa=4)}">Voltar ao orçamento</a><button class="botao botao-principal" data-pedido-imprimir>Imprimir / salvar PDF</button><button class="botao botao-secundario" data-pedido-copiar>Copiar mensagem</button></div>
<section class="cartao" data-pedido-proposta><header class="pedido-proposta-cabecalho"><img th:src="${tenantLogoUrl}" alt="" width="56" height="56"><div><strong th:text="${tenantNome}"></strong><h1>Orçamento <span th:text="|#${pedido.codigo}|"></span></h1><p th:text="${pedido.titulo}"></p></div></header><p th:if="${pedido.status.editavel}" class="aviso-info">Rascunho — confira os dados antes de enviar.</p><h2 th:text="${pedido.cliente==null?'Cliente a informar':pedido.cliente}"></h2><p th:if="${pedido.contato}" th:text="${pedido.contato}"></p>
<article class="pedido-proposta-item" th:each="i:${pedido.itens}"><span class="pedido-foto"><i class="bi bi-box"></i><img data-pedido-foto alt="" th:src="@{/orcamentos/itens/{id}/foto(id=${i.id})}"></span><div><h3 th:text="${i.nome}"></h3><p th:text="${i.materiais}"></p><p th:text="|${i.quantidade} un. × R$ ${#numbers.formatDecimal(i.precoUnitario,1,'POINT',2,'COMMA')}|"></p></div><strong th:text="|R$ ${#numbers.formatDecimal(i.total,1,'POINT',2,'COMMA')}|"></strong></article>
<dl class="pedido-totais"><div><dt>Peças</dt><dd th:text="|R$ ${#numbers.formatDecimal(pedido.subtotal,1,'POINT',2,'COMMA')}|"></dd></div><div><dt>Desconto</dt><dd th:text="|R$ ${#numbers.formatDecimal(pedido.desconto,1,'POINT',2,'COMMA')}|"></dd></div><div><dt>Frete</dt><dd th:text="|R$ ${#numbers.formatDecimal(pedido.frete,1,'POINT',2,'COMMA')}|"></dd></div><div class="pedido-total"><dt>Total</dt><dd th:text="|R$ ${#numbers.formatDecimal(pedido.total,1,'POINT',2,'COMMA')}|"></dd></div></dl><p th:if="${pedido.previsao!=null}" th:text="|Previsão de produção: ${#temporals.format(pedido.previsao,'dd/MM/yyyy HH:mm')}.|"></p><p>Prazo sujeito à confirmação na aprovação. Entrega e pagamento devem ser combinados.</p><p th:if="${pedido.observacoes}" class="pedido-observacoes" th:text="${pedido.observacoes}"></p></section><th:block th:replace="~{orcamentos/fragmentos :: contatos}"></th:block></main></body></html>
