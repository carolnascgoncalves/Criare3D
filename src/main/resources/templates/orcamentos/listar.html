<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecalho('Orçamentos e pedidos')}"></head><body><nav th:replace="~{fragmentos :: menu}"></nav><main class="pagina pagina-pedidos"><th:block th:replace="~{orcamentos/fragmentos :: avisos}"></th:block><section class="pagina-intro"><div><span class="texto-apoio">DA PROPOSTA À ENTREGA</span><h1>Orçamentos e pedidos</h1><p>Prepare, aprove e acompanhe o mesmo trabalho.</p></div><a class="botao botao-principal" th:href="@{/orcamentos/novo}"><i class="bi bi-plus-lg"></i> Novo orçamento</a></section>
<nav class="operacao-abas" aria-label="Orçamentos ativos ou arquivados"><a th:href="@{/orcamentos(arquivados=false,busca=${busca},status=${statusFiltro})}" th:classappend="${arquivados != true?' ativo':''}">Ativos</a><a th:href="@{/orcamentos(arquivados=true,busca=${busca},status=${statusFiltro})}" th:classappend="${arquivados == true?' ativo':''}"><i class="bi bi-archive"></i> Arquivados</a></nav><form class="pedido-busca" th:action="@{/orcamentos}" method="get"><input type="hidden" name="arquivados" th:value="${arquivados == true}"><label class="campo">Buscar por título ou cliente<input name="busca" th:value="${busca}" maxlength="150" placeholder="Nome da peça ou cliente"></label><label class="campo">Status<select name="status"><option value="">Todos os status</option><option th:each="s:${statusOpcoes}" th:value="${s.name()}" th:selected="${statusFiltro==s}" th:text="${s.descricao}"></option></select></label><button class="botao botao-principal">Pesquisar</button><a class="botao botao-secundario" th:href="@{/orcamentos(arquivados=${arquivados==true})}">Limpar</a></form>
<section class="cartao" th:if="${pagina.empty}"><h2>Nenhum orçamento encontrado</h2><p>Comece por uma peça já calculada ou use o atalho no resultado do cálculo.</p></section>
<div class="pedido-lista"><article class="cartao pedido-card" th:each="p:${pagina.content}"><span class="operacao-etiqueta" th:text="${p.situacao}"></span><small th:text="|#${p.codigo} · ${#temporals.format(p.criadoEm,'dd/MM/yyyy')}|"></small><h2><a th:href="@{/orcamentos/{id}(id=${p.id})}" th:text="${p.titulo}"></a></h2><p th:text="${p.cliente == null or #strings.isEmpty(p.cliente) ? 'Cliente ainda não informado' : p.cliente}"></p><p th:text="|${#lists.size(p.itens)} itens · R$ ${#numbers.formatDecimal(p.total,1,'POINT',2,'COMMA')}|"></p><small th:text="${p.pagoEm == null ? 'Pagamento pendente' : 'Pagamento registrado'}"></small><a class="botao botao-secundario" th:href="@{/orcamentos/{id}(id=${p.id})}" th:text="${p.status.editavel ? 'Continuar orçamento' : 'Acompanhar pedido'}"></a><form th:if="${!p.operacional}" th:action="@{/orcamentos/{id}/arquivar(id=${p.id})}" method="post"><input type="hidden" name="arquivar" th:value="${!p.arquivado}"><button class="botao botao-secundario"><i th:class="${p.arquivado?'bi bi-arrow-counterclockwise':'bi bi-archive'}"></i> <span th:text="${p.arquivado?'Restaurar':'Arquivar'}"></span></button></form></article></div>
<nav class="pedido-acoes" aria-label="Páginas"><a class="botao botao-secundario" th:if="${pagina.hasPrevious()}" th:href="@{/orcamentos(page=${pagina.number-1},busca=${busca},arquivados=${arquivados == true},status=${statusFiltro})}">Anterior</a><span th:text="|Página ${pagina.number+1} de ${T(java.lang.Math).max(1,pagina.totalPages)}|"></span><a class="botao botao-secundario" th:if="${pagina.hasNext()}" th:href="@{/orcamentos(page=${pagina.number+1},busca=${busca},arquivados=${arquivados == true},status=${statusFiltro})}">Próxima</a></nav></main></body></html>
