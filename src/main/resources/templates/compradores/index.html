<!DOCTYPE html><html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragmentos :: cabecalho('Clientes')}"></head><body><nav th:replace="~{fragmentos :: menu}"></nav><main class="pagina">
<section class="pagina-intro"><div><span class="texto-apoio">SEUS CLIENTES</span><h1>Clientes</h1><p>Reutilize os contatos nos orçamentos. Alterar um cadastro não modifica propostas anteriores.</p></div></section>
<p th:if="${mensagemSucesso}" th:text="${mensagemSucesso}" class="alerta-sucesso notificacao-flutuante" role="status"></p>
<section class="cartao formulario-conteudo"><h2 th:text="${comprador.id==null?'Novo cliente':'Editar cliente'}"></h2><form th:action="@{/compradores}" th:object="${comprador}" method="post" class="formulario"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{versao}"><div class="form-grade"><label class="campo">Nome<input th:field="*{nome}" required minlength="2" maxlength="150"><small class="erro-campo" th:errors="*{nome}"></small></label><label class="campo">Telefone / WhatsApp<input type="tel" th:field="*{telefone}" maxlength="150"></label><label class="campo">E-mail<input type="email" th:field="*{email}" maxlength="150"><small class="erro-campo" th:errors="*{email}"></small></label></div><label class="campo">Observações<textarea th:field="*{observacoes}" maxlength="500"></textarea></label><div class="formulario-acoes"><button class="botao botao-principal">Salvar cliente</button><a th:if="${comprador.id!=null}" th:href="@{/compradores}" class="botao botao-secundario">Cancelar edição</a></div></form></section>
<section class="cartao formulario-conteudo"><form method="get" class="operacao-acoes"><input name="busca" th:value="${busca}" placeholder="Nome, telefone ou e-mail" aria-label="Buscar clientes"><input type="hidden" name="arquivados" th:value="${arquivados}"><button class="botao botao-principal">Pesquisar</button><a th:href="@{/compradores(arquivados=${!arquivados})}" th:text="${arquivados?'Ver ativos':'Ver arquivados'}"></a></form><p th:if="${pagina.empty}">Nenhum cliente encontrado.</p>
<article class="operacao-registro" th:each="c:${pagina}"><div><strong th:text="${c.nome}"></strong><span th:text="${c.telefone}"></span><span th:text="${c.email}"></span></div><div class="operacao-acoes"><a class="botao botao-secundario" th:href="@{/orcamentos(comprador=${c.id})}">Ver orçamentos</a><a class="botao botao-secundario" th:href="@{/compradores(editar=${c.id})}">Editar</a><form method="post" th:action="@{/compradores/{id}/estado(id=${c.id})}"><input type="hidden" name="arquivado" th:value="${!c.arquivado}"><button class="botao botao-secundario" th:text="${c.arquivado?'Restaurar':'Arquivar'}"></button></form></div></article>
<nav class="operacao-acoes" aria-label="Páginas de clientes"><a th:if="${pagina.hasPrevious()}" th:href="@{/compradores(page=${pagina.number-1},busca=${busca},arquivados=${arquivados})}">Anterior</a><a th:if="${pagina.hasNext()}" th:href="@{/compradores(page=${pagina.number+1},busca=${busca},arquivados=${arquivados})}">Próxima</a></nav></section></main></body></html>
