
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Nova Embalagem')}"></head>
<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">
    <section class="pagina-intro">
        <div>
            <span class="texto-apoio">SEUS MATERIAIS</span>
            <h1>Cadastrar embalagem</h1>
            <p>Adicione uma nova embalagem ao seu catálogo.</p>
        </div>

        <a th:href="@{/embalagem/listar}" class="botao botao-secundario">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </section>

    <section class="cartao">
        <div class="cartao-cabecalho">
            <div>
                <h2>Informações da embalagem</h2>
                <p>Preencha os dados da embalagem e seu custo unitário.</p>
            </div>
        </div>

        <div class="formulario-conteudo">
            <form th:action="@{/embalagem/cadastrar}"
                  th:object="${embalagem}"
                  method="post"
                  class="formulario">

                <div class="campo">
                    <label for="nome">Nome da embalagem</label>
                    <input type="text" id="nome" th:field="*{nome}"
                           minlength="2" maxlength="150" required>

                    <div class="erro-campo"
                         th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}"></div>
                </div>

                <div class="campo">
                    <label for="custoUnitario">Custo unitário (R$)</label>
                    <input type="number" id="custoUnitario"
                           th:field="*{custoUnitario}"
                           step="0.01" min="0.01" required>

                    <div class="erro-campo"
                         th:if="${#fields.hasErrors('custoUnitario')}"
                         th:errors="*{custoUnitario}"></div>
                </div>

                <div class="formulario-acoes">
                    <button type="submit" class="botao botao-principal">
                        <i class="bi bi-check-lg"></i> Cadastrar embalagem
                    </button>

                    <a th:href="@{/embalagem/listar}" class="botao botao-secundario">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>

</body>
</html>
