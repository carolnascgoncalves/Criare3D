<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><meta name="turbo-cache-control" content="no-cache">
<title>Recuperar acesso — Criare3D</title><link rel="stylesheet" th:href="@{/css/login.css}">
</head><body class="login-pagina"><main class="login-cartao">
<header class="login-cabecalho"><h1>Recuperar acesso</h1><p>Receba um link para criar uma nova senha.</p></header>
<p th:if="${!recuperacaoDisponivel}" class="login-aviso">O envio de e-mails ainda não está configurado. Peça uma senha temporária à pessoa que administra sua conta.</p>
<div th:if="${enviado}" class="login-aviso login-aviso-sucesso" role="status">Se houver uma conta ativa para esse e-mail, enviaremos um link de recuperação. Confira também a pasta de spam.</div>
<form th:if="${recuperacaoDisponivel and enviado == null}" th:action="@{/recuperar-senha}" th:object="${recuperacao}" method="post" class="login-formulario">
<div class="login-campo"><label for="email">E-mail da conta</label><input id="email" type="email" th:field="*{email}" maxlength="150" autocomplete="email" required></div>
<button class="login-botao" type="submit">Enviar link de recuperação</button></form>
<p class="login-ajuda"><a th:href="@{/login}">Voltar ao acesso</a></p></main></body></html>
