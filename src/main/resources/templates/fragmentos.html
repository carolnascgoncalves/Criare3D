
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${titulo}">Criare 3D</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link th:href="@{/css/style.css(v=3)}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cssCalculo.css(v=8)}">

    <meta name="turbo-cache-control" content="no-cache">

    <!-- Token CSRF também no cabeçalho das requisições do Turbo -->
    <meta name="csrf-token" th:content="${_csrf.token}">

    <script defer src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-umd.js"></script>

    <script th:src="@{/js/placeholders.js(v=1)}" defer></script>
    <script th:src="@{/js/configuracao.js(v=1)}" defer></script>
    <script th:src="@{/js/validacaoInline.js(v=1)}" defer></script>
    <script th:src="@{/js/calculoEtapas.js(v=3)}" defer></script>
    <script th:src="@{/js/filamentosCalculo.js(v=4)}" defer></script>
    <script th:src="@{/js/rascunhoCalculo.js(v=5)}" defer></script>
    <script th:src="@{/js/detalhesHistorico.js(v=1)}" defer></script>
</head>

<body>

<nav th:fragment="menu" class="menu-principal">
    <a th:href="@{/}" class="marca">
        <img th:src="@{/images/criare3d.jpg}" alt="Criare 3D" class="marca-icone">
        <span>Criare 3D</span>
    </a>

    <div class="menu-links">
        <a th:href="@{/}" class="menu-link">Início</a>
        <a th:href="@{/peca/listar}" class="menu-link">Peças</a>
        <a th:href="@{/filamento/listar}" class="menu-link">Filamentos</a>
        <a th:href="@{/impressora/listar}" class="menu-link">Impressoras</a>
        <a th:href="@{/embalagem/listar}" class="menu-link">Embalagens</a>
        <a th:href="@{/historico/listar}" class="menu-link">Histórico</a>

        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/usuarios/listar}"
           class="menu-link">Usuários</a>

        <a th:href="@{/historico/novo(novo=true)}" class="botao-menu menu-calcular">
            <i class="bi bi-calculator"></i>
            Calcular peça
        </a>
    </div>

    <div class="menu-acoes">
        <span sec:authentication="name" class="usuario-logado"></span>

        <form th:action="@{/logout}" method="post">
            <button type="submit" class="botao-sair">
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </button>
        </form>

        <a th:href="@{/configuracao}"
           class="menu-link menu-configuracoes"
           aria-label="Configurações"
           title="Configurações">
            <i class="bi bi-gear-fill"></i>
        </a>
    </div>
</nav>

<script th:fragment="bootstrap-script"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
