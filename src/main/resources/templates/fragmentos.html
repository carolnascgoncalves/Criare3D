
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="${#strings.replace(titulo, 'Criare 3D', tenantNome)}">Criare 3D</title>
    <link rel="icon" th:href="${tenantLogoUrl}"
          th:attr="type=${tenantTemLogo ? 'image/png' : 'image/jpeg'}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link th:href="@{/css/style.css}" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/cssCalculo.css}">
    <link th:if="${temaCssUrl != null}" rel="stylesheet" th:href="${temaCssUrl}">

    <meta name="turbo-cache-control" content="no-preview">

    <!-- Token CSRF também no cabeçalho das requisições do Turbo -->
    <meta name="csrf-token" th:content="${_csrf.token}">

    <script defer src="https://cdn.jsdelivr.net/npm/@hotwired/turbo@8.0.23/dist/turbo.es2017-umd.js"></script>
    <script th:src="@{/js/dashboardCharts.js}" defer></script>
    <script th:src="@{/js/menuMobile.js}" defer></script>

    <script th:src="@{/js/placeholders.js}" defer></script>
    <script th:src="@{/js/configuracao.js}" defer></script>
    <script th:src="@{/js/notificacoes.js}" defer></script>
    <script th:src="@{/js/selecaoListagem.js}" defer></script>
    <script th:src="@{/js/restaurarRolagem.js}" defer></script>
    <script th:src="@{/js/validacaoInline.js}" defer></script>
    <script th:src="@{/js/calculoEtapas.js}" defer></script>
    <script th:src="@{/js/filamentosCalculo.js}" defer></script>
    <script th:src="@{/js/rascunhoCalculo.js}" defer></script>
    <script th:src="@{/js/mercadoLivreFrete.js}" defer></script>
    <script th:src="@{/js/detalhesHistorico.js}" defer></script>
    <script th:src="@{/js/orcamento.js}" defer></script>
    <script th:src="@{/js/ordenacaoListagem.js}" defer></script>
    <script th:src="@{/js/clientes.js}" defer></script>
</head>

<body>

<nav th:fragment="menu" class="menu-principal">
    <a th:href="${tenantDisponivel} ? @{/} : @{/clientes/listar}" class="marca">
        <img th:src="${tenantLogoUrl}" th:alt="${tenantNome}" class="marca-icone"
             width="42" height="42" decoding="async">
        <span th:text="${tenantNome}">Criare 3D</span>
    </a>

    <div class="menu-links">
    <details class="menu-links-dropdown" open>
        <summary class="menu-links-resumo"><i class="bi bi-list" aria-hidden="true"></i> Menu</summary>
        <div class="menu-links-opcoes">
        <a th:if="${tenantDisponivel}" th:href="@{/}" class="menu-link" th:classappend="${paginaAtiva == 'inicio' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'inicio' ? 'page' : null}">Início</a>
        <a th:if="${tenantDisponivel}" th:href="@{/dashboard}" class="menu-link" th:classappend="${paginaAtiva == 'dashboard' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'dashboard' ? 'page' : null}">Dashboard</a>
        <a th:if="${tenantDisponivel}" th:href="@{/peca/listar}" class="menu-link" th:classappend="${paginaAtiva == 'pecas' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'pecas' ? 'page' : null}">Peças</a>
        <a th:if="${tenantDisponivel}" th:href="@{/filamento/listar}" class="menu-link" th:classappend="${paginaAtiva == 'filamentos' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'filamentos' ? 'page' : null}">Filamentos</a>
        <a th:if="${tenantDisponivel}" th:href="@{/impressora/listar}" class="menu-link" th:classappend="${paginaAtiva == 'impressoras' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'impressoras' ? 'page' : null}">Impressoras</a>
        <a th:if="${tenantDisponivel}" th:href="@{/embalagem/listar}" class="menu-link" th:classappend="${paginaAtiva == 'embalagens' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'embalagens' ? 'page' : null}">Embalagens</a>
        <a th:if="${tenantDisponivel}" th:href="@{/historico/listar}" class="menu-link" th:classappend="${paginaAtiva == 'historico' ? ' menu-link-ativo' : ''}" th:attr="aria-current=${paginaAtiva == 'historico' ? 'page' : null}">Histórico</a>

        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/clientes/listar}"
           class="menu-link"
           th:classappend="${paginaAtiva == 'clientes' ? ' menu-link-ativo' : ''}"
           th:attr="aria-current=${paginaAtiva == 'clientes' ? 'page' : null}">Clientes</a>

        </div>
    </details>
    <a th:if="${tenantDisponivel}" th:href="@{/historico/novo}" class="botao-menu menu-calcular">
        <i class="bi bi-calculator"></i>
        Calcular peça
    </a>
    </div>

    <div class="menu-acoes">
        <details class="menu-usuario">
            <summary class="menu-usuario-botao"
                     aria-label="Mostrar e-mail da conta"
                     title="Mostrar e-mail da conta">
                <i class="bi bi-person-circle" aria-hidden="true"></i>
            </summary>
            <div class="menu-usuario-painel">
                <span class="menu-usuario-legenda">Conta conectada</span>
                <strong sec:authentication="name" class="menu-usuario-email"></strong>
                <a th:href="@{/conta}">Minha conta</a>
            </div>
        </details>

        <a th:href="@{/configuracao}"
           class="menu-link menu-configuracoes"
           aria-label="Configurações"
           title="Configurações">
            <i class="bi bi-gear-fill"></i>
        </a>

    </div>
</nav>

<script th:fragment="bootstrap-script"
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
