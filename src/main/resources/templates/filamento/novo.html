
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Novo Filamento')}"></head>
<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">
    <section class="pagina-intro">
        <div>
            <span class="texto-apoio">SEUS MATERIAIS</span>
            <h1>Novo filamento</h1>
            <p>Cadastre um filamento para utilizá-lo nos cálculos de impressão.</p>
        </div>
    </section>

    <section class="cartao">
        <div class="cartao-cabecalho">
            <div>
                <h2>Dados do filamento</h2>
                <p>Preencha as informações do rolo adquirido.</p>
            </div>
        </div>
        <div class="formulario-conteudo">
            <form th:action="@{/filamento/cadastrar}"
                  th:object="${filamento}"
                  method="post"
                  class="formulario"
                  novalidate>

                <input type="hidden" name="origem" th:value="${origem}">

                <div class="campo">
                    <label for="nome">Nome do filamento</label>
                    <input type="text"
                           id="nome"
                           th:field="*{nome}"
                           minlength="2"
                           maxlength="150"
                           required>
                    <span class="erro-campo" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
                </div>


                <div class="campo">
                    <label for="cor">Nome da cor</label>
                    <input type="text"
                           id="cor"
                           th:field="*{cor}"
                           placeholder="Ex.: Verde-menta"
                           minlength="2"
                           maxlength="80"
                           required>
                    <span class="erro-campo"
                          th:if="${#fields.hasErrors('cor')}"
                          th:errors="*{cor}"></span>
                </div>

                <div class="campo">
                    <label for="codigoCor">Escolha a cor</label>
                    <input type="color"
                           id="codigoCor"
                           th:field="*{codigoCor}"
                           value="#75C9A5"
                           required>
                    <small>Selecione a tonalidade exata do filamento.</small>
                </div>


                    <div class="campo">
                        <label for="marca">Marca <span class="etiqueta-opcional">Opcional</span></label>
                        <input type="text"
                               id="marca"
                               th:field="*{marca}"
                               maxlength="150">
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('marca')}"
                              th:errors="*{marca}"></span>
                    </div>

                    <div class="campo">
                        <label for="pesoRoloGramas">Peso do rolo (gramas)</label>
                        <input type="number"
                               id="pesoRoloGramas"
                               th:field="*{pesoRoloGramas}"
                               min="0.01"
                               step="0.01"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('pesoRoloGramas')}"
                              th:errors="*{pesoRoloGramas}"></span>
                    </div>

                    <div class="campo">
                        <label for="estoqueGramas">Quantidade disponível agora (gramas) <span class="etiqueta-opcional">Opcional</span></label>
                        <input type="number" id="estoqueGramas" th:field="*{estoqueGramas}" min="0" step="0.01" placeholder="Se deixar vazio, será usado o peso do rolo">
                        <small>Use este campo se o rolo já estiver parcialmente usado.</small>
                        <span class="erro-campo" th:if="${#fields.hasErrors('estoqueGramas')}" th:errors="*{estoqueGramas}"></span>
                    </div>

                    <div class="campo">
                        <label for="precoRolo">Preço do rolo (R$)</label>
                        <input type="number"
                               id="precoRolo"
                               th:field="*{precoRolo}"
                               min="0.01"
                               step="0.01"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('precoRolo')}"
                              th:errors="*{precoRolo}"></span>
                    </div>

                <div class="formulario-acoes formulario-salvar-fixo">
                    <button type="submit" data-turbo-submits-with="Salvando…" class="botao botao-principal">
                        <i class="bi bi-check-lg"></i> Cadastrar filamento
                    </button>

                    <a th:href="@{/filamento/listar}" class="botao botao-secundario">
                        Cancelar
                    </a>

                </div>
            </form>
        </div>
    </section>
</main>

</body>
</html>
