
<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Editar Filamento')}"></head>
<body>

<div th:replace="~{fragmentos :: menu}"></div>

<main class="pagina">
    <section class="pagina-intro">
        <div>
            <span class="texto-apoio">SEUS MATERIAIS</span>
            <h1>Editar filamento</h1>
            <p>Atualize as informações do filamento cadastrado.</p>
        </div>
        <a th:href="@{/filamento/listar}" class="botao botao-secundario">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
    </section>

    <section class="cartao">
        <div class="cartao-cabecalho">
            <div>
                <h2>Dados do filamento</h2>
                <p>Altere os campos que deseja atualizar.</p>
            </div>
        </div>
        <div class="formulario-conteudo">
            <form th:action="@{/filamento/atualizar/{id}(id=${id})}"
                  th:object="${filamento}"
                  method="post"
                  class="formulario formulario-filamento"
                  novalidate>


                    <div class="campo">
                        <label for="nome">Nome do filamento</label>
                        <input type="text"
                               id="nome"
                               th:field="*{nome}"
                               minlength="2"
                               maxlength="150"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('nome')}"
                              th:errors="*{nome}"></span>
                    </div>

                    <div class="campo">
                        <label for="cor">Nome da cor</label>
                        <input type="text"
                               id="cor"
                               th:field="*{cor}"
                               minlength="2"
                               maxlength="80"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('cor')}"
                              th:errors="*{cor}"></span>
                    </div>

                    <div class="campo">
                        <label for="codigoCor">Escolha a cor</label>
                        <input type="color"
                               id="codigoCor"
                               th:field="*{codigoCor}"
                               required>
                        <div class="erro-campo"
                             th:if="${#fields.hasErrors('codigoCor')}"
                             th:errors="*{codigoCor}">
                        </div>
                        <small>Você pode alterar a tonalidade do filamento.</small>
                    </div>

                    <div class="campo">
                        <label for="marca">Marca <span class="etiqueta-opcional">Opcional</span></label>
                        <input type="text"
                               id="marca"
                               th:field="*{marca}"
                               maxlength="150">
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('marca')}"
                              th:errors="*{marca}"></span>
                    </div>

                    <div class="campo">
                        <label for="pesoRoloGramas">Peso do rolo (gramas)</label>
                        <input type="number"
                               id="pesoRoloGramas"
                               th:field="*{pesoRoloGramas}"
                               min="0.01"
                               step="0.01"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('pesoRoloGramas')}"
                              th:errors="*{pesoRoloGramas}"></span>
                    </div>

                    <div class="campo">
                        <label for="estoqueGramas">Quantidade disponível agora (gramas) <span class="etiqueta-opcional">Opcional</span></label>
                        <input type="number" id="estoqueGramas" th:field="*{estoqueGramas}" min="0" step="0.01">
                        <small>Atualize este saldo quando comprar ou usar filamento fora do sistema.</small>
                        <span class="erro-campo" th:if="${#fields.hasErrors('estoqueGramas')}" th:errors="*{estoqueGramas}"></span>
                    </div>

                    <div class="campo">
                        <label for="precoRolo">Preço do rolo (R$)</label>
                        <input type="number"
                               id="precoRolo"
                               th:field="*{precoRolo}"
                               min="0.01"
                               step="0.01"
                               required>
                        <span class="erro-campo"
                              th:if="${#fields.hasErrors('precoRolo')}"
                              th:errors="*{precoRolo}"></span>
                    </div>

                <div class="formulario-acoes">
                    <button type="submit" class="botao botao-principal">
                        <i class="bi bi-check-lg"></i> Salvar alterações
                    </button>
                    <a th:href="@{/filamento/listar}" class="botao botao-secundario">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </section>
</main>

</body>
</html>
