<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos :: cabecalho('Não foi possível concluir')}" ></head>
<body>
<nav th:replace="~{fragmentos :: menu}"></nav>
<main class="pagina pagina-erro">
    <section class="cartao erro-centralizado" role="alert">
        <span class="texto-apoio" th:text="|ERRO ${codigo}|">ERRO</span>
        <h1>Não foi possível concluir</h1>
        <p th:text="${mensagem}">Tente novamente.</p>
        <a class="botao botao-principal" th:href="@{/}">Voltar ao início</a>
    </section>
</main>
</body>
</html>
